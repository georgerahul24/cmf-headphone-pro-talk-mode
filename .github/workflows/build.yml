name: Build

# Builds the Android APK and the macOS app on every push, and attaches both to
# a GitHub Release when a tag like v1.0.0 is pushed.
#
# Optional secret ANDROID_KEYSTORE_B64: base64 of a keystore (alias
# androiddebugkey, passwords "android"). With it, every APK is signed with the
# same key so updates install over the old app.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: |
          version=$(grep versionName android/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp android/app/build/outputs/apk/release/app-release.apk "CMF-Talk-Mode-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: CMF-Talk-Mode-*.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app and dmg
        run: ./mac/build.sh --dmg
      - name: Zip
        run: cd mac/build && ditto -c -k --keepParent "CMF Talk Mode.app" CMF-Talk-Mode-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            mac/build/CMF-Talk-Mode.dmg
            mac/build/CMF-Talk-Mode-mac.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
